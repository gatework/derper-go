name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag on main's history
        id: version
        run: |
          test "$GITHUB_REF_TYPE" = tag
          python3 scripts/release_assets.py version "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          python3 -c 'import sys; sys.path.insert(0,"scripts"); from publish_release import changelog_notes; changelog_notes(sys.argv[1])' "$GITHUB_REF_NAME"
          commit=$(git rev-parse HEAD)
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$commit"
          test "$GITHUB_SHA" = "$commit"
          git merge-base --is-ancestor "$commit" origin/main
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read
  publish:
    needs: [version, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-linux-*
          merge-multiple: true
          path: dist
      - name: Verify both archives and create the release checksums
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          python3 scripts/release_assets.py checksums dist "$RELEASE_VERSION" "$RELEASE_COMMIT"
          (cd dist && sha256sum -c checksums.txt)
      - name: Attest the exact tested release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
          create-storage-record: false
      - name: Upload, read back and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py "$RELEASE_VERSION" "$RELEASE_COMMIT" --repo "$GITHUB_REPOSITORY"
