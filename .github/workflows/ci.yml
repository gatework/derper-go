name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version embedded in the tested distribution
        type: string
        default: dev
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
defaults:
  run:
    shell: bash
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          BUILD_VERSION: ${{ inputs.version || 'dev' }}
        run: python3 scripts/release_assets.py version "$BUILD_VERSION" --allow-dev >> "$GITHUB_OUTPUT"
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting and module consistency
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Validate workflows and release failure recovery
        run: |
          bash -n scripts/package.sh integration/systemd.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - run: go test -race -timeout 5m ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -show verbose ./...
  build:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      BUILD_VERSION: ${{ needs.metadata.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build versioned static distribution
        run: make package VERSION="$BUILD_VERSION" COMMIT="$GITHUB_SHA" ARCHES="$ARCH"
      - name: Inspect and execute the packaged binary on its native architecture
        run: |
          cd dist
          sha256sum -c checksums.txt
          tar -xzf "derper-go_${BUILD_VERSION}_linux_${ARCH}.tar.gz"
          cd "derper-go_${BUILD_VERSION}_linux_${ARCH}"
          ./derper-go version | grep -F "derper-go $BUILD_VERSION ($GITHUB_SHA),"
          ./derper-go config check -c examples/config.json
          ./derper-go tailnet config -c examples/config.json > /dev/null
          ./derper-go service render -c examples/config.json --binary "$PWD/derper-go" > "$RUNNER_TEMP/derper-go.service"
          systemd-analyze verify --recursive-errors=no "$RUNNER_TEMP/derper-go.service"
      - name: Check reproducibility
        if: matrix.arch == 'amd64'
        run: |
          make package VERSION="$BUILD_VERSION" COMMIT="$GITHUB_SHA" ARCHES="$ARCH" DIST_DIR=dist/rebuild
          cmp "dist/derper-go_${BUILD_VERSION}_linux_${ARCH}.tar.gz" "dist/rebuild/derper-go_${BUILD_VERSION}_linux_${ARCH}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux-${{ matrix.arch }}
          path: dist/derper-go_${{ env.BUILD_VERSION }}_linux_${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
  systemd:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUILD_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-linux-amd64
          path: dist
      - name: Use the exact distribution binary in the installation fixture
        run: |
          archive="dist/derper-go_${BUILD_VERSION}_linux_amd64.tar.gz"
          python3 scripts/release_assets.py verify "$archive" "$BUILD_VERSION" "$GITHUB_SHA" amd64
          tar -xzf "$archive" -C dist
          mkdir -p bin
          install -m 0755 "dist/derper-go_${BUILD_VERSION}_linux_amd64/derper-go" bin/derper-go
          docker build -t derper-go-systemd -f integration/Dockerfile .
      - name: Exercise real systemd installation and restart
        timeout-minutes: 5
        run: |
          docker run -d --name derper-go-systemd --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock --tmpfs /tmp derper-go-systemd
          for _ in $(seq 1 60); do
            if docker exec derper-go-systemd systemctl show -p Version --value; then break; fi
            sleep 1
          done
          docker exec -e DERPER_GO_SYSTEMD_TEST=1 derper-go-systemd /opt/systemd-test.sh
      - name: Container diagnostics
        if: failure()
        run: |
          docker logs derper-go-systemd || true
          docker exec derper-go-systemd journalctl -u derper-go.service -u derper-go-credential-test.service --no-pager || true
          docker exec derper-go-systemd systemctl status derper-go.service --no-pager || true
          docker exec derper-go-systemd systemctl cat derper-go-credential-test.service || true
      - name: Clean up isolated container
        if: always()
        run: docker rm -f derper-go-systemd || true
